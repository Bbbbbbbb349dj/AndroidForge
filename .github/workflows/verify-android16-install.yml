name: Verify published APK installation on Android 16

on:
  push:
    branches: ["arena/3ce57ebf-androidforge"]
    paths:
      - ".github/workflows/verify-android16-install.yml"
      - "scripts/verify_android_install.sh"
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  install-published-apk:
    name: Install exact published ARM64 APK on API 36
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
      - name: Download and verify exact user-facing APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p install-diagnostics
          gh release download nuvio-enhanced-v1.21-fresh-install --repo "$GITHUB_REPOSITORY" \
            --pattern 'Nuvio-Enhanced-v1.21-full-arm64-v8a-fresh-install.apk' --dir install-diagnostics
          APK="$GITHUB_WORKSPACE/install-diagnostics/Nuvio-Enhanced-v1.21-full-arm64-v8a-fresh-install.apk"
          echo "32f8075a26687d7922aaa5ca8f47b19dbb83ff4ef398403fbce01fb3a6f5fce4  $APK" | sha256sum -c -
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee install-diagnostics/signature.txt
          "$BT/zipalign" -c -P 16 -v 4 "$APK" > install-diagnostics/alignment.txt
          "$BT/aapt2" dump badging "$APK" > install-diagnostics/badging.txt
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install published APK using Android 16 package manager
        uses: reactivecircus/android-emulator-runner@v2
        env:
          EXPECTED_VERSION_CODE: '210'
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/verify_android_install.sh
      - name: Publish public installation result as a check
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          root = Path('install-diagnostics')
          result = root / 'install-result.txt'
          text = result.read_text() if result.exists() else 'Installation did not run; inspect earlier job steps.'
          props = root / 'emulator-properties.txt'
          if props.exists():
              text += '\n\n' + '\n'.join(line for line in props.read_text().splitlines()
                                           if any(key in line for key in ('cpu.abi', 'version.sdk', 'native.bridge')))
          logcat = root / 'package-manager-logcat.txt'
          if logcat.exists():
              text += '\n\n' + '\n'.join(line for line in logcat.read_text().splitlines()
                                           if any(key in line.lower() for key in ('failed', 'invalid', 'parse', 'install_failed')))[-40000:]
          payload = {'name': 'android16-install-result', 'head_sha': os.environ['HEAD_SHA'],
                     'status': 'completed', 'conclusion': 'success' if 'Success' in text[:1000] else 'failure',
                     'output': {'title': 'Published APK: Android 16 install result', 'summary': text[:60000]}}
          subprocess.run(['gh', 'api', '--method', 'POST', 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/check-runs', '--input', '-'],
                         input=json.dumps(payload), text=True, check=True)
          PY
      - name: Preserve public APK installation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android16-install-diagnostics
          path: |
            install-diagnostics/*.txt
          if-no-files-found: warn
          retention-days: 14
