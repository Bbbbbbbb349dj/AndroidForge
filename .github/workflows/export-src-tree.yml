name: Export Source Tree

on:
  push:
    branches:
      - "arena/17a4641a-androidforge"
    paths:
      - ".github/workflows/export-src-tree.yml"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Export source files & AAR class signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/exp
          curl -fsSL -L "https://github.com/Bbbbbbbb349dj/AndroidForge/releases/download/nuvio-source-v1.1.2/Nuvio-Enhanced-2-v1.1.2-cloudstream-settings-source.zip" -o /tmp/exp/src.zip
          unzip -q /tmp/exp/src.zip -d /tmp/exp/ext
          ROOT=$(find /tmp/exp/ext -mindepth 1 -maxdepth 1 -type d | head -1)

          mkdir -p /tmp/exp/aar
          unzip -q "$ROOT/composeApp/libs/cloudstream-runtime-api-4.8.0-3496e5f.aar" -d /tmp/exp/aar
          if [ -f /tmp/exp/aar/classes.jar ]; then
            jar tf /tmp/exp/aar/classes.jar | sort > "$ROOT/AAR_CLASSES_LIST.txt"
            KEY_CLASSES=$(jar tf /tmp/exp/aar/classes.jar | grep '\.class$' | grep -E 'Plugin|MainAPI|Activity|Acra|Context|App|Settings|HomePage|SearchResponse|LoadResponse|Extractor' | sed 's/\.class$//; s/\//./g' | head -n 120 || true)
            if [ -n "$KEY_CLASSES" ]; then
              javap -cp /tmp/exp/aar/classes.jar -p $KEY_CLASSES > "$ROOT/AAR_JAVAP_SIGNATURES.txt" 2>&1 || true
            fi
          fi

          cd "$ROOT"
          find . -type f \
            ! -name "*.aar" \
            ! -name "*.jar" \
            ! -name "*.so" \
            ! -name "*.png" \
            ! -name "*.jpg" \
            ! -name "*.jpeg" \
            ! -name "*.webp" \
            ! -name "*.ttf" \
            ! -name "*.otf" \
            ! -name "*.icns" \
            ! -name "*.ico" \
            ! -name "*.mp4" \
            ! -name "*.mov" \
            -print0 | tar --null -czf /tmp/exp/sources.tar.gz --files-from=-
          ls -lh /tmp/exp/sources.tar.gz

          python3 - <<'PY'
          import base64, json, os, urllib.request
          from pathlib import Path

          data = Path("/tmp/exp/sources.tar.gz").read_bytes()
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['REPO']}/git/blobs",
              data=json.dumps({
                  "content": base64.b64encode(data).decode("ascii"),
                  "encoding": "base64",
              }).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                  "Accept": "application/vnd.github+json",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ExportSrcTree",
              },
              method="POST",
          )
          with urllib.request.urlopen(req, timeout=120) as resp:
              sha = json.loads(resp.read().decode("utf-8"))["sha"]
          print(f"::notice title=SRC_TAR_BLOB::{sha}")
          PY
